name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    # GitHub Actions will spin up these ephemeral Docker containers just for the test run!
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shortly
          POSTGRES_PASSWORD: shortly_password
          POSTGRES_DB: shortly
        ports:
          - 5432:5432
        # Tells GitHub to wait until Postgres is fully booted before running tests
        options: >-
          --health-cmd "pg_isready -U shortly -d shortly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip" # Speeds up the pipeline by caching dependencies

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests with Pytest
      env:
        # We point the tests to the ephemeral GitHub Actions service containers
        TEST_DATABASE_URL: postgresql+asyncpg://shortly:shortly_password@localhost:5432/shortly
        REDIS_URL: redis://localhost:6379/0
        SHORT_CODE_SECRET: test_secret_key_for_ci
      run: |
        pytest tests/ -v